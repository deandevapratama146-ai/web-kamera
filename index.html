<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Kamera & Studio</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><h1>Web Kamera & Studio</h1><p>Input pemakaian peralatan dan pemeriksaan studio.</p></header><nav><button class="tab active" data-tab="pemakaian">Pemakaian</button><button class="tab" data-tab="studio">Pemeriksaan Studio</button><button class="tab" data-tab="perangkat">Perangkat</button><button class="tab" data-tab="pengaturan">Pengaturan</button></nav><main>
<section id="pemakaian" class="panel active"><h2>Input Pemakaian</h2><form id="usageForm"><div class="grid"><label>Tanggal<input id="date" type="date" required></label><label>Unit Bisnis<input id="unit" required></label><label>Durasi Pemakaian<input id="duration" placeholder="Contoh: 3 jam" required></label></div><label>Nama Peralatan<select id="equipment" multiple size="7"></select></label><div id="equipmentChecks" class="checks"></div><label>Nama Peralatan Utama<input id="equipmentName" placeholder="Contoh: Kamera Sony A7III"></label><label>Keterangan<textarea id="usageNote"></textarea></label><button class="primary">Simpan ke Spreadsheet</button></form><div id="msg"></div></section>
<section id="studio" class="panel"><div class="row"><h2>Pemeriksaan Studio</h2><button id="addStudio" class="secondary">+ Tambah Studio</button></div><div id="studioList"></div></section>
<section id="perangkat" class="panel"><div class="row"><h2>Daftar Perangkat</h2><button id="addDevice" class="secondary">+ Tambah Perangkat</button></div><div id="deviceList"></div></section>
<section id="pengaturan" class="panel"><h2>Pengaturan</h2><label>URL Google Apps Script Web App<input id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec"></label><button id="saveSettings" class="primary">Simpan Pengaturan</button><p class="hint">Gunakan URL Web App Apps Script dari file Code.gs. Data perangkat/studio disimpan di browser ini.</p></section>
</main></div><script src="app.js"></script></body></html>
