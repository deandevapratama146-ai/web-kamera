<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Input Data Kamera</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;padding:20px}
.container{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 20px #0001}
h2{margin-top:0}label{display:block;margin-top:12px;font-weight:600}
input,textarea,button{width:100%;margin-top:7px;padding:13px;font-size:16px;border:1px solid #ddd;border-radius:9px}
textarea{min-height:90px;resize:vertical}button{border:0;background:#111;color:#fff;font-weight:700}
button.secondary{background:#555}button:disabled{opacity:.5}
video,img{width:100%;margin-top:12px;border-radius:10px;background:#111;display:block}
#preview{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#status{margin-top:15px;padding:10px;border-radius:8px;background:#f5f5f5;min-height:20px}
small{color:#666}
</style>
</head>
<body>
<div class="container">
<h2>Input Data</h2>
<small>Isi data, ambil foto, lalu tekan Simpan.</small>

<label>Nama</label>
<input id="nama" type="text" placeholder="Nama">

<label>No. HP</label>
<input id="nohp" type="tel" placeholder="08xxxxxxxxxx">

<label>Keterangan</label>
<textarea id="keterangan" placeholder="Keterangan"></textarea>

<div class="row">
<button onclick="bukaKamera()">📷 Buka Kamera</button>
<button class="secondary" onclick="tutupKamera()">Tutup Kamera</button>
</div>

<video id="kamera" autoplay playsinline></video>
<button onclick="ambilFoto()">📸 Ambil Foto</button>
<canvas id="canvas" style="display:none"></canvas>
<img id="preview" alt="Preview foto">

<button id="saveBtn" onclick="simpanData()" style="margin-top:14px">💾 Simpan</button>
<div id="status">Siap.</div>
</div>

<script>
/* URL ini diisi setelah Google Apps Script selesai di-deploy. */
const SCRIPT_URL = "PASTE_URL_GOOGLE_APPS_SCRIPT_DI_SINI";

let stream=null, fotoBase64="";

async function bukaKamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    setStatus("❌ Kamera membutuhkan browser HTTPS yang mendukung kamera.");
    return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},audio:false
    });
    document.getElementById("kamera").srcObject=stream;
    setStatus("📷 Kamera aktif.");
  }catch(e){setStatus("❌ Kamera gagal dibuka: "+e.message);}
}
function tutupKamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  document.getElementById("kamera").srcObject=null;
}
function ambilFoto(){
  const v=document.getElementById("kamera");
  if(!v.videoWidth){setStatus("❌ Buka kamera terlebih dahulu.");return;}
  const c=document.getElementById("canvas"), max=1280;
  const s=Math.min(1,max/v.videoWidth);
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  fotoBase64=c.toDataURL("image/jpeg",.8);
  const p=document.getElementById("preview");p.src=fotoBase64;p.style.display="block";
  setStatus("✅ Foto siap.");
}
async function simpanData(){
  if(SCRIPT_URL.includes("PASTE_URL_")){
    setStatus("⚠️ URL Google Apps Script belum dimasukkan.");return;
  }
  const data={
    nama:document.getElementById("nama").value.trim(),
    nohp:document.getElementById("nohp").value.trim(),
    keterangan:document.getElementById("keterangan").value.trim(),
    foto:fotoBase64,tipeFoto:"image/jpeg"
  };
  if(!data.nama){setStatus("⚠️ Nama wajib diisi.");return;}
  const btn=document.getElementById("saveBtn");btn.disabled=true;setStatus("⏳ Menyimpan...");
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(data)});
    const result=await r.json();
    if(result.success){
      setStatus("✅ Data berhasil disimpan.");
      document.getElementById("nama").value="";
      document.getElementById("nohp").value="";
      document.getElementById("keterangan").value="";
      fotoBase64="";document.getElementById("preview").style.display="none";tutupKamera();
    }else setStatus("❌ "+(result.error||"Gagal menyimpan."));
  }catch(e){setStatus("❌ Gagal terhubung ke Google Apps Script.");}
  finally{btn.disabled=false;}
}
function setStatus(m){document.getElementById("status").textContent=m;}
</script>
</body>
</html>
